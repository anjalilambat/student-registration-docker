spring.application.name=studentapp

# Docker Compose supplies DB_URL, DB_USERNAME, and DB_PASSWORD.
# Local fallback is for running the backend outside Docker.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/student_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
