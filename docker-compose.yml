services:
  database:
    build:
      context: ./database
    image: student-db:local
    container_name: student-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-student_db}
      MARIADB_USER: ${MARIADB_USER:-studentapp}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - student-network

  backend:
    build:
      context: ./backend
    image: student-backend:local
    container_name: student-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mariadb://database:3306/${MARIADB_DATABASE:-student_db}
      DB_USERNAME: ${MARIADB_USER:-studentapp}
      DB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - student-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: student-frontend:local
    container_name: student-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - student-network

volumes:
  mariadb_data:

networks:
  student-network:
    driver: bridge
